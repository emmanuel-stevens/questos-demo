<svg xmlns="http://www.w3.org/2000/svg" width="92" height="104" viewBox="0 0 92 104">
  <!-- THE BOOKCASE FRAME, a nine-slice (cornice 34, sides 22, plinth 22). "The gold ground", ruled D130 = B on 2026-10-01: an arcade of round arches for a cornice,
       twisted gilt columns for pilasters, enamel at the corners. Same
       nine-slice geometry as version 1 (34 / 22 / 22 / 22). -->
  <defs>
    <linearGradient id="gild" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset="0.4" stop-color="#e2ba4c"/><stop offset="1" stop-color="#6f4f0f"/>
    </linearGradient>
    <linearGradient id="gildx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f4f0f"/><stop offset="0.45" stop-color="#f6dc86"/><stop offset="1" stop-color="#8a6516"/>
    </linearGradient>
    <radialGradient id="lapis" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#9dbdf0"/><stop offset="0.4" stop-color="#2f5fa3"/><stop offset="1" stop-color="#0f2447"/>
    </radialGradient>
    <g id="arch">
      <rect x="0" y="9" width="24" height="21" fill="#17335c"/>
      <path d="M2.5 30 V19 A9.5 9.5 0 0 1 21.5 19 V30" fill="#0f2447" stroke="url(#gild)" stroke-width="1.6"/>
      <path d="M12 14.5 V25.5 M8 19 H16" stroke="#e9c45a" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="12" cy="19" r="1.2" fill="#8a1c12" stroke="#f3d98b" stroke-width="0.4"/>
      <circle cx="0" cy="12.5" r="1.5" fill="#e9c45a"/><circle cx="24" cy="12.5" r="1.5" fill="#e9c45a"/>
    </g>
    <g id="cornice">
      <rect x="0" y="0" width="48" height="34" fill="#150d06"/>
      <rect x="0" y="0" width="48" height="3" fill="url(#gild)"/>
      <rect x="0" y="3" width="48" height="2.6" fill="#8a1c12"/>
      <rect x="0" y="5.6" width="48" height="3.4" fill="url(#gild)"/>
      <use href="#arch"/><use href="#arch" transform="translate(24 0)"/>
      <rect x="0" y="30" width="48" height="2.2" fill="url(#gild)"/>
      <rect x="0" y="32.2" width="48" height="1.8" fill="#0b0703" opacity="0.8"/>
    </g>
    <g id="cap">
      <rect x="0" y="0" width="22" height="3" fill="url(#gild)"/>
      <rect x="0" y="3" width="22" height="2.6" fill="#8a1c12"/>
      <rect x="0" y="5.6" width="22" height="3.4" fill="url(#gild)"/>
      <rect x="3" y="9" width="19" height="21" fill="url(#gild)" stroke="#4a3208" stroke-width="0.6"/>
      <rect x="5.5" y="11.5" width="14" height="16" fill="#17335c" stroke="#8a1c12" stroke-width="0.8"/>
      <circle cx="12.5" cy="19.5" r="4.6" fill="url(#lapis)" stroke="url(#gild)" stroke-width="1.2"/>
      <circle cx="11" cy="18" r="1" fill="#eaf2ff" opacity="0.9"/>
      <rect x="2" y="30" width="20" height="2.2" fill="url(#gild)"/>
      <rect x="4" y="32.2" width="18" height="1.8" fill="#0b0703" opacity="0.8"/>
    </g>
    <!-- a twisted column: a gilt shaft with dark diagonal bands, period 12 -->
    <g id="pilaster">
      <rect x="6" y="34" width="16" height="48" fill="#150d06"/>
      <rect x="8.5" y="34" width="11" height="48" fill="url(#gildx)"/>
      <g stroke="#3a2608" stroke-width="2.4" stroke-linecap="butt">
        <path d="M8.5 37 L19.5 31"/><path d="M8.5 49 L19.5 43"/><path d="M8.5 61 L19.5 55"/><path d="M8.5 73 L19.5 67"/><path d="M8.5 85 L19.5 79"/>
      </g>
      <rect x="6" y="34" width="2.5" height="48" fill="#150d06"/><rect x="19.5" y="34" width="2.5" height="48" fill="#150d06"/>
      <rect x="21.2" y="34" width="0.8" height="48" fill="#e9c45a"/>
    </g>
    <g id="plinth">
      <rect x="0" y="82" width="48" height="2.2" fill="url(#gild)"/>
      <rect x="0" y="84.2" width="48" height="4" fill="#8a1c12"/>
      <rect x="0" y="88.2" width="48" height="2" fill="url(#gild)"/>
      <rect x="0" y="90.2" width="48" height="13.8" fill="#150d06"/>
      <path d="M6 97 L12 93.5 L18 97 L12 100.5 Z M30 97 L36 93.5 L42 97 L36 100.5 Z" fill="none" stroke="#b08422" stroke-width="0.8"/>
    </g>
    <g id="foot">
      <rect x="2" y="82" width="20" height="2.2" fill="url(#gild)"/>
      <rect x="1" y="84.2" width="21" height="4" fill="#8a1c12"/>
      <rect x="0" y="88.2" width="22" height="2" fill="url(#gild)"/>
      <rect x="0" y="90.2" width="22" height="13.8" fill="#1d1208"/>
      <rect x="3" y="93" width="16" height="8" fill="#17335c" stroke="url(#gild)" stroke-width="0.9"/>
    </g>
    <clipPath id="col"><rect x="6" y="34" width="16" height="48"/></clipPath>
  </defs>
  <use href="#cornice" transform="translate(22 0)"/>
  <use href="#cap"/><use href="#cap" transform="translate(92 0) scale(-1 1)"/>
  <g clip-path="url(#col)"><use href="#pilaster"/></g>
  <g transform="translate(92 0) scale(-1 1)"><g clip-path="url(#col)"><use href="#pilaster"/></g></g>
  <use href="#plinth" transform="translate(22 0)"/>
  <use href="#foot"/><use href="#foot" transform="translate(92 0) scale(-1 1)"/>
</svg>
